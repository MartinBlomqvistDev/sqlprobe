<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nl2sql chat</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    --bg: #faf9f7;
    --panel: #ffffff;
    --ink: #1c1b19;
    --muted: #6b6862;
    --line: #e4e1db;
    --accent: #3f6b5c;
    --user: #eef2f0;
    --error: #a3402f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #16181a;
    --panel: #1f2224;
    --ink: #e9e7e3;
    --muted: #9a968f;
    --line: #32363a;
    --accent: #7fb3a0;
    --user: #262b2e;
    --error: #e0806f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  header button {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 13px;
  }
  #status { font-size: 13px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { margin-bottom: 22px; }
  .msg .who {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .bubble {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--user); }
  .bubble.error { color: var(--error); border-color: var(--error); }
  .tool {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 9px 12px;
    margin: 10px 0;
    color: var(--muted);
    overflow-x: auto;
  }
  .tool .label { color: var(--accent); font-weight: 600; }
  .tool pre { margin: 6px 0 0; white-space: pre-wrap; }
  table { border-collapse: collapse; margin-top: 12px; font-size: 13px; width: 100%; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  th { background: var(--bg); font-weight: 600; }
  .table-scroll { overflow-x: auto; }
  .chart { margin-top: 14px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 14px 20px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  #q {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  #send {
    padding: 11px 22px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .hint { max-width: 820px; margin: 10px auto 0; font-size: 12.5px; color: var(--muted); }
  .hint button {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 20px;
    padding: 4px 11px;
    margin: 3px 4px 0 0;
    cursor: pointer;
    font-size: 12.5px;
  }
</style>
</head>
<body>
<header>
  <h1>nl2sql chat</h1>
  <span id="status">ready</span>
  <span class="spacer"></span>
  <button id="theme">theme</button>
</header>

<div id="chat"><div class="wrap" id="stream"></div></div>

<footer>
  <div class="composer">
    <input id="q" placeholder="Ask something about the data..." autocomplete="off">
    <button id="send">Ask</button>
  </div>
  <div class="hint">
    Try:
    <button class="ex">How has revenue developed month by month?</button>
    <button class="ex">Which product categories sell best?</button>
    <button class="ex">Who are our ten highest spending customers?</button>
  </div>
</footer>

<script>
// Point this at your server. Everything else in this file is presentation.
const API = "http://127.0.0.1:8000/api/chat";
const API_KEY = "";   // set if the server has API_KEY configured

const stream = document.getElementById("stream");
const input = document.getElementById("q");
const send = document.getElementById("send");
const status = document.getElementById("status");
const history = [];

document.getElementById("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
};
if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) {
  document.documentElement.dataset.theme = "dark";
}

document.querySelectorAll(".ex").forEach(b => {
  b.onclick = () => { input.value = b.textContent; ask(); };
});
send.onclick = ask;
input.onkeydown = e => { if (e.key === "Enter") ask(); };

function addMessage(who, cssClass) {
  const msg = document.createElement("div");
  msg.className = "msg " + cssClass;
  msg.innerHTML = `<div class="who">${who}</div>`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  msg.appendChild(bubble);
  stream.appendChild(msg);
  scroll();
  return { msg, bubble };
}

function scroll() {
  const chat = document.getElementById("chat");
  chat.scrollTop = chat.scrollHeight;
}

function renderTable(result, container) {
  const rows = result.rows || [];
  if (!rows.length) return;
  const shown = rows.slice(0, 30);
  const columns = result.columns || Object.keys(shown[0]);
  const head = columns.map(c => `<th>${escapeHtml(c)}</th>`).join("");
  const body = shown.map(r =>
    "<tr>" + columns.map(c => `<td>${escapeHtml(String(r[c] ?? ""))}</td>`).join("") + "</tr>"
  ).join("");
  const wrapper = document.createElement("div");
  wrapper.className = "table-scroll";
  wrapper.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  if (rows.length > shown.length) {
    const note = document.createElement("div");
    note.className = "tool";
    note.textContent = `showing ${shown.length} of ${rows.length} rows`;
    wrapper.appendChild(note);
  }
  container.appendChild(wrapper);
  scroll();
}

function renderChart(figureJson, container) {
  const target = document.createElement("div");
  target.className = "chart";
  container.appendChild(target);
  try {
    const figure = JSON.parse(figureJson);
    Plotly.newPlot(target, figure.data, figure.layout, { responsive: true, displayModeBar: false });
  } catch (err) {
    target.textContent = "Could not render the chart: " + err.message;
  }
  scroll();
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function ask() {
  const question = input.value.trim();
  if (!question || send.disabled) return;
  input.value = "";
  send.disabled = true;
  status.textContent = "thinking...";

  addMessage("you", "user").bubble.textContent = question;
  const { msg, bubble } = addMessage("assistant", "bot");
  let answer = "";

  try {
    const headers = { "Content-Type": "application/json" };
    if (API_KEY) headers["X-API-Key"] = API_KEY;

    const response = await fetch(API, {
      method: "POST",
      headers,
      body: JSON.stringify({ question, history })
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE frames are separated by a blank line.
      const frames = buffer.split("\n\n");
      buffer = frames.pop();

      for (const frame of frames) {
        const line = frame.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;

        let event;
        try { event = JSON.parse(line.slice(6)); } catch { continue; }

        if (event.type === "token") {
          answer += event.text;
          bubble.textContent = answer;
          scroll();
        } else if (event.type === "tool_call") {
          const box = document.createElement("div");
          box.className = "tool";
          const query = event.input.query;
          box.innerHTML = `<span class="label">${escapeHtml(event.tool)}</span>`
            + (query ? `<pre>${escapeHtml(query)}</pre>` : "");
          msg.appendChild(box);
          status.textContent = "running " + event.tool + "...";
          scroll();
        } else if (event.type === "tool_result") {
          if (event.result.error) {
            const box = document.createElement("div");
            box.className = "tool";
            box.textContent = event.result.error;
            msg.appendChild(box);
          } else if (event.result.figure_json) {
            renderChart(event.result.figure_json, msg);
          } else if (event.result.rows) {
            renderTable(event.result, msg);
          }
          status.textContent = "thinking...";
        } else if (event.type === "error") {
          const box = document.createElement("div");
          box.className = "bubble error";
          box.textContent = event.message;
          msg.appendChild(box);
        }
      }
    }

    if (answer) {
      history.push({ role: "user", content: question });
      history.push({ role: "assistant", content: answer });
    }
  } catch (err) {
    const box = document.createElement("div");
    box.className = "bubble error";
    box.textContent = "Could not reach the server: " + err.message;
    msg.appendChild(box);
  }

  status.textContent = "ready";
  send.disabled = false;
  input.focus();
}

input.focus();
</script>
</body>
</html>
