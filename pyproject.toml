[project]
name = "nl2sql-chat"
version = "0.1.0"
description = "Natural language to SQL chat agent: multi-provider LLM tool use, SELECT-only guardrails, SSE streaming"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Martin Blomqvist", email = "cm.blomqvist@gmail.com" }]
keywords = ["llm", "sql", "agent", "fastapi", "sse", "text-to-sql"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "sqlglot>=25.0",
    "plotly>=5.22",
    "anthropic>=0.40",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nl2sql*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
